name: Build LucentFold APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "Preparing LucentFold Android project..."

          if [ ! -f "LucentFold-Mobile-Source.zip" ]; then
            echo "ERROR: LucentFold-Mobile-Source.zip not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          rm -rf app
          rm -rf gradle

          rm -f build.gradle.kts
          rm -f settings.gradle.kts
          rm -f gradle.properties
          rm -f .gitignore
          rm -f README.md

          unzip -q -o "LucentFold-Mobile-Source.zip" -d .

          echo "Project files:"
          ls -la

          echo "Checking required files..."

          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "gradle.properties"
          test -f "app/build.gradle.kts"
          test -f "app/src/main/AndroidManifest.xml"

          echo "Android project prepared successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "Checking Android SDK..."

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager not found in PATH."
            echo "Searching for sdkmanager..."

            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)

            if [ -z "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager could not be found."
              exit 1
            fi

            export PATH="$(dirname "$SDKMANAGER"):$PATH"
          fi

          echo "sdkmanager location:"
          command -v sdkmanager

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null || true

          echo "Installing required Android SDK components..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK preparation completed."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Gradle environment
        shell: bash
        run: |
          set -e

          java -version
          gradle --version

          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          echo "Starting LucentFold APK build..."

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug

          echo "APK build completed."

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "Build output:"
            find app/build -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LucentFold-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
